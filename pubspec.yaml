name: build_version
description: A builder for extracting a package version into code.
version: 3.0.0-wip
repository: https://github.com/kevmoo/build_version

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.7.0
  build: any
  # Not imported in code, but used to constrain `build.yaml` requirements
  build_config: ^1.4.0
  pubspec_parse: ^1.6.0

dev_dependencies:
  api_summary: ^1.2.0
  build_runner: ^2.17.1
  build_test: ^3.5.23
  build_verify: ^3.1.1
  checked_yaml: ^2.0.4
  dart_flutter_team_lints: ^3.5.2
  test: ^1.33.0

executables:
  build_version:
